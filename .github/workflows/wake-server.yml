name: Wake Render Server
on: 
  schedule:
    - cron: '* * * * *'
      timezone: 'America/Chicago'
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request
        env: 
          FULL_URL: ${{ secrets.RENDER_URL }}/api/ping
        run: curl https://dopa-ke7w.onrender.com/api/ping
  
